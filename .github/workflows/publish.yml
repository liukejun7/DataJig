name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact DataJig version from pyproject.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish verified wheels
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          pattern: datajig-*
          merge-multiple: true
      - name: Verify exactly four wheels and release identity
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*"))
          assert len(wheels) == 4, f"expected exactly four wheels, found: {wheels}"
          assert all(path.suffix == ".whl" for path in wheels), wheels

          identities = set()
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  metadata_paths = [
                      name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                  ]
                  assert len(metadata_paths) == 1, (wheel, metadata_paths)
                  metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
                  identities.add((metadata["Name"].lower(), metadata["Version"]))

          assert len(identities) == 1, identities
          name, version = identities.pop()
          assert name == "datajig", name

          if os.environ["RELEASE_EVENT"] == "push":
              expected_ref = f"refs/tags/v{version}"
              assert os.environ["RELEASE_REF"] == expected_ref, (
                  os.environ["RELEASE_REF"],
                  expected_ref,
              )
          else:
              assert os.environ["DISPATCH_VERSION"] == version, (
                  os.environ["DISPATCH_VERSION"],
                  version,
              )
          PY
      - name: Stage GitHub Release and attach verified wheels
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "DataJig ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
