name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reject internal artifacts and incorrect commit identity
        run: python3 tools/check_repository_hygiene.py --mode history

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - name: Build debug binary
        run: cargo build --locked --manifest-path rust/Cargo.toml --workspace

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Compile Python sources
        run: python -m compileall -q src

  cli-integration:
    name: CLI integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.0
      - name: Build debug binary
        run: cargo build --locked --manifest-path rust/Cargo.toml --workspace
      - name: Install Python package
        run: python -m pip install -e '.[dev,duckdb]'
      - name: Run CLI integration tests
        env:
          DATAJIG_NATIVE: ${{ github.workspace }}/rust/target/debug/datajig-core
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
