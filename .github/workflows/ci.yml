name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_m1_preview:
        description: Attach the Linux test binary to the M1 preview release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reject internal artifacts and incorrect commit identity
        run: python3 tools/check_repository_hygiene.py --mode history

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path rust/Cargo.toml --workspace
      - name: Build debug binary
        run: cargo build --locked --manifest-path rust/Cargo.toml --workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datajig-native-linux-x86_64
          path: rust/target/debug/datajig-core
          if-no-files-found: error

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Compile Python sources
        run: python -m compileall -q src

  cli-integration:
    name: CLI integration / ${{ matrix.test-suite }}
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - core-workflows
          - transform-pipeline
          - training-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: datajig-native-linux-x86_64
          path: rust/target/debug
      - name: Activate native binary
        run: chmod +x rust/target/debug/datajig-core
      - name: Install Python package
        run: |
          python -m pip install -r requirements/ci-duckdb.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run real-data integration suite
        env:
          DATAJIG_NATIVE: ${{ github.workspace }}/rust/target/debug/datajig-core
          PYTHONPATH: src
        run: python tools/run_ci_suite.py ${{ matrix.test-suite }}

  python-compatibility:
    name: Python compatibility ${{ matrix.python-version }}
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: datajig-native-linux-x86_64
          path: rust/target/debug
      - name: Activate native binary
        run: chmod +x rust/target/debug/datajig-core
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements/ci-duckdb.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run cross-version data workflows
        env:
          DATAJIG_NATIVE: ${{ github.workspace }}/rust/target/debug/datajig-core
          PYTHONPATH: src
        run: >-
          python -m unittest -v
          tests.test_transform_cli.TransformCliWorkflowTests.test_inline_parameters_are_bound_without_being_treated_as_a_path
          tests.test_tutorial.TutorialTests.test_tutorial_runs_one_complete_verified_training_workflow

  m1-preview:
    name: Publish M1 preview
    if: github.event_name == 'workflow_dispatch' && inputs.publish_m1_preview
    needs:
      - repository-hygiene
      - rust
      - python
      - cli-integration
      - python-compatibility
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      PREVIEW_TAG: v0.9.0-m1-preview.1
      PREVIEW_ARCHIVE: datajig-0.9-m1-preview-ubuntu-22.04-x86_64.tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.0
      - name: Build Ubuntu 22.04 compatible binary
        run: cargo build --release --locked --manifest-path rust/Cargo.toml --workspace
      - name: Verify runtime compatibility
        run: |
          rust/target/release/datajig-core --version
          highest_glibc="$({ objdump -T rust/target/release/datajig-core \
            | sed -n 's/.*(GLIBC_\([^)]*\)).*/\1/p' \
            | sort -Vu \
            | tail -1; } || true)"
          echo "Highest required GLIBC version: ${highest_glibc:-none}"
          if [ -n "$highest_glibc" ] && \
             [ "$(printf '%s\n' "$highest_glibc" '2.35' | sort -V | tail -1)" != '2.35' ]; then
            echo "Binary requires GLIBC newer than Ubuntu 22.04 provides" >&2
            exit 1
          fi
      - name: Package preview binary
        run: |
          chmod +x rust/target/release/datajig-core
          tar -C rust/target/release -czf "$PREVIEW_ARCHIVE" datajig-core
          sha256sum "$PREVIEW_ARCHIVE" > "$PREVIEW_ARCHIVE.sha256"
      - name: Publish preview release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$PREVIEW_ARCHIVE" "$PREVIEW_ARCHIVE.sha256"
          else
            gh release create "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "DataJig 0.9 M1 testing preview" \
              --notes "Testing-only Linux x86_64 binary for the DataJig 0.9 M1 checkpoint. This is not a production release or a PyPI publication." \
              "$PREVIEW_ARCHIVE" "$PREVIEW_ARCHIVE.sha256"
          fi
